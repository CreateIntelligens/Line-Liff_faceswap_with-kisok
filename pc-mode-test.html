<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Mode Test</title>
</head>
<body>
  <h1>PC Mode Test Links</h1>
  <ul>
    <li><a href="http://localhost:5173/?mode=pc">開啟 PC 模式（使用 mode=pc 參數）</a></li>
    <li><a href="http://localhost:5173/">正常模式（手機/LINE）</a></li>
  </ul>

  <h2>使用說明：</h2>
  <ol>
    <li>點擊「開啟 PC 模式」連結會啟動相機拍照功能</li>
    <li>拍照後會生成 QR Code 供手機下載</li>
    <li>正常模式則使用上傳照片功能</li>
  </ol>

  <h2>PC 模式功能：</h2>
  <ul>
    <li>✅ 使用電腦攝影機拍照</li>
    <li>✅ 5秒倒數計時器</li>
    <li>✅ Loading 動畫</li>
    <li>✅ 生成 QR Code 供手機掃描下載</li>
  </ul>
</body>
</html>
