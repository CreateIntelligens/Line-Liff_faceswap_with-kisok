<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <title>face swap</title>
  
  <!-- 全局配置 - 可在打包後直接修改 -->
  <script>
    // ===== API 配置 =====
    // 這些配置可以在打包後的 dist 目錄中直接修改
    window.endpoint = {
      // API 基礎 URL - 修改這裡來改變 API 伺服器地址
      baseURL: 'https://pp.2025.aitago.tw/api',
      // 認證 Token
      authToken: '123',
      // 請求超時時間（毫秒）
      timeout: 30000,
      // 調試模式 - 設為 true 可以在控制台看到詳細日誌
      debug: true,
      
      // ===== 圖片處理 API 配置 =====
      // 圖片處理 API 端點 - 修改這裡來改變圖片處理服務器
      imageProcessApi: 'https://stg-api.fanpokka.ai/api/static-resource',
      // 圖片處理參數 - 修改這裡來調整圖片處理效果
      imageProcessParams: {
        scale: 2,        // 圖片縮放比例：0.5, 1, 1.5, 2
        format: 'jpg',   // 圖片格式：jpg, png, webp
        quality: 90,     // 圖片品質：1-100
        width: 800,      // 圖片寬度（像素）
        height: 600      // 圖片高度（像素）
      },
      // 是否啟用圖片處理功能
      enableImageProcessing: true,

      // ===== 圖片上傳 API 配置 =====
      // 圖片上傳 API 端點
      imageUploadApi: 'https://stg-line-crm.fanpokka.ai/partner/v1/files/upload',
      // 圖片上傳請求頭
      imageUploadHeaders: {
        'x-api-key': 'ak_f8eb8db2d517feaaf41558f108d7862ee93c84c9d81457794b9a821dd5b0b360'
      },

      // ===== 裝置模式配置 =====
      // 裝置模式：'auto' 自動偵測 | 'kiosk' 強制 Kiosk 模式 | 'mobile' 強制手機模式
      deviceMode: 'auto',
      // Kiosk 裝置 ID（用於識別不同的 Kiosk 設備）
      kioskId: 'kiosk_test_003',
      
      // ===== GCS 上傳配置 =====
      // 是否啟用 GCS 上傳功能（等後端 API 準備好後設為 true）
      enableGCSUpload: false
      // GCS 上傳 API 端點（如果與 baseURL 不同）
      // gcsUploadApi: 'https://your-api.com/api/upload-to-gcs'
    };
    
    // 輸出配置到控制台（如果啟用調試模式）
    if (window.endpoint.debug) {
      console.log('🔧 當前 API 配置:', window.endpoint);
      
      // 檢查是否在開發環境
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        console.log('🌐 檢測到本地開發環境');
      }
      
      // 輸出圖片處理 API 配置
      if (window.endpoint.enableImageProcessing) {
        console.log('🖼️ 圖片處理 API 配置:');
        console.log('  - 端點:', window.endpoint.imageProcessApi);
        console.log('  - 參數:', window.endpoint.imageProcessParams);
        console.log('💡 修改這些配置可以調整圖片處理效果');
      }
      
      // 輸出裝置模式配置
      console.log('📱 裝置模式配置:');
      console.log('  - 模式:', window.endpoint.deviceMode);
      console.log('  - Kiosk ID:', window.endpoint.kioskId);
    }
  </script>
  
  <script type="module" src="/resources/js/app.js?t=1758510799533"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      /* 禁止觸控裝置的左右滑動手勢導航和雙指縮放 */
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }

    #vue-root {
      min-height: 100vh;
      /* 禁止觸控裝置的左右滑動手勢導航和雙指縮放 */
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }
  </style>
</head>
<body>
  <div id="vue-root" data-component="FaceSwapApp"></div>

  <!-- 禁用右鍵選單 -->
  <script>
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });
  </script>

  <!-- 禁止左右滑動導航 -->
  <script>
    // 禁止觸控裝置的左右滑動返回/前進功能
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    // 監聽 touchstart 事件
    document.addEventListener('touchstart', function(e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }, { passive: false });

    // 監聽 touchmove 事件
    document.addEventListener('touchmove', function(e) {
      const touchEndX = e.touches[0].clientX;
      const touchEndY = e.touches[0].clientY;

      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      const absDeltaX = Math.abs(deltaX);
      const absDeltaY = Math.abs(deltaY);

      // 如果是水平滑動（左右滑動大於上下滑動）
      if (absDeltaX > absDeltaY && absDeltaX > 5) {
        // 特別處理從邊緣開始的滑動（平板常見的手勢）
        const isEdgeSwipe = touchStartX < 50 || touchStartX > window.innerWidth - 50;

        // 阻止所有水平滑動，特別是從邊緣開始的
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    }, { passive: false, capture: true });

    // 監聽 touchend 事件，防止快速滑動
    document.addEventListener('touchend', function(e) {
      const touchDuration = Date.now() - touchStartTime;

      // 如果是快速滑動，也阻止
      if (touchDuration < 300) {
        e.preventDefault();
      }
    }, { passive: false });

    // 額外的手勢事件阻止（針對某些瀏覽器）
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('gesturechange', function(e) {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('gestureend', function(e) {
      e.preventDefault();
    }, { passive: false });

    // 阻止瀏覽器的導航手勢
    window.addEventListener('popstate', function(e) {
      // 如果不是用戶主動點擊返回按鈕，則阻止
      e.preventDefault();
      history.pushState(null, null, location.href);
    });

    // 初始化時推入一個狀態
    history.pushState(null, null, location.href);
  </script>
</body>
</html>
