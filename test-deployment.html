<!DOCTYPE html>
<html>
<head>
    <title>Deployment Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        #console-output { background: #f8f9fa; padding: 10px; border: 1px solid #dee2e6; height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🧪 部署測試頁面</h1>

    <div id="test-results"></div>

    <h3>控制台輸出：</h3>
    <div id="console-output"></div>

    <script>
        const testResults = document.getElementById('test-results');
        const consoleOutput = document.getElementById('console-output');

        // 劫持 console 方法來顯示輸出
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn
        };

        function addToConsoleOutput(type, ...args) {
            const div = document.createElement('div');
            div.textContent = `[${type.toUpperCase()}] ${args.join(' ')}`;
            div.style.color = type === 'error' ? 'red' : type === 'warn' ? 'orange' : 'black';
            consoleOutput.appendChild(div);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;

            // 調用原始 console 方法
            originalConsole[type](...args);
        }

        console.log = (...args) => addToConsoleOutput('log', ...args);
        console.error = (...args) => addToConsoleOutput('error', ...args);
        console.warn = (...args) => addToConsoleOutput('warn', ...args);

        function addTestResult(testName, success, message) {
            const div = document.createElement('div');
            div.className = `test-result ${success ? 'success' : 'error'}`;
            div.innerHTML = `<strong>${testName}:</strong> ${message}`;
            testResults.appendChild(div);
        }

        // 測試 1: 載入主要應用程式
        try {
            console.log('開始測試主要 JS 檔案載入...');

            // 模擬載入主應用
            const iframe = document.createElement('iframe');
            iframe.src = 'http://localhost:8080';
            iframe.style.display = 'none';

            iframe.onload = function() {
                try {
                    console.log('✅ 主頁面載入成功');
                    addTestResult('主頁面載入', true, '成功載入 http://localhost:8080');

                    // 檢查 iframe 中的錯誤
                    setTimeout(() => {
                        try {
                            const iframeWindow = iframe.contentWindow;
                            if (iframeWindow.console && iframeWindow.console.error) {
                                console.log('✅ 沒有檢測到 JavaScript 錯誤');
                                addTestResult('JavaScript 執行', true, '沒有檢測到運行時錯誤');
                            }
                        } catch (e) {
                            console.log('⚠️ 無法檢查 iframe 錯誤（CORS 限制）');
                            addTestResult('JavaScript 執行', true, 'iframe 載入正常（CORS 限制無法檢查詳細錯誤）');
                        }
                    }, 2000);

                } catch (e) {
                    console.error('❌ iframe 載入錯誤:', e);
                    addTestResult('主頁面載入', false, e.message);
                }
            };

            iframe.onerror = function(e) {
                console.error('❌ iframe 載入失敗:', e);
                addTestResult('主頁面載入', false, '載入失敗');
            };

            document.body.appendChild(iframe);

        } catch (e) {
            console.error('❌ 測試設置錯誤:', e);
            addTestResult('測試設置', false, e.message);
        }

        // 測試 2: 直接測試 JavaScript 載入
        fetch('http://localhost:8080/assets/index.B44OeUVL.js')
            .then(response => {
                if (response.ok) {
                    console.log('✅ 主 JS 檔案可以正常獲取');
                    addTestResult('JS 檔案獲取', true, `檔案大小: ${(response.headers.get('content-length') / 1024).toFixed(1)}KB`);

                    return response.text();
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            })
            .then(jsContent => {
                // 檢查是否包含未定義的變數
                const undefinedVars = jsContent.match(/__[A-Z_]+__/g);
                if (undefinedVars && undefinedVars.length > 0) {
                    console.error('❌ 發現未定義變數:', undefinedVars);
                    addTestResult('變數定義檢查', false, `發現未定義變數: ${undefinedVars.join(', ')}`);
                } else {
                    console.log('✅ 沒有發現未定義的變數');
                    addTestResult('變數定義檢查', true, '所有變數都已正確定義');
                }
            })
            .catch(e => {
                console.error('❌ JS 檔案獲取失敗:', e);
                addTestResult('JS 檔案獲取', false, e.message);
            });

        // 測試 3: 測試資源檔案
        const testResources = [
            '/images/super.uMLVNhIc.png',
            '/images/play.DWhd8tNf.png',
            '/images/love.D_ocUFtL.png'
        ];

        testResources.forEach(resource => {
            fetch(`http://localhost:8080${resource}`, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        console.log(`✅ 資源可用: ${resource}`);
                        addTestResult('資源檔案', true, `${resource} 載入正常`);
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                })
                .catch(e => {
                    console.error(`❌ 資源載入失敗: ${resource}`, e);
                    addTestResult('資源檔案', false, `${resource} 載入失敗: ${e.message}`);
                });
        });

        console.log('🚀 部署測試開始...');
    </script>
</body>
</html>
